<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account &amp; Data Deletion | theKami Apps</title>
  <meta name="description" content="Official Account and Data Deletion portal for mobile applications developed by theKami (Kumail Raza Bangash) in compliance with Google Play Policies.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #462C7D;
      --secondary: #831C91;
      --tertiary: #D552A3;
      --quaternary: #FF70BF;
      --bg-dark: #0e0a17;
      --card-bg: #181226;
      --card-hover: #221a36;
      --text-main: #f8fafc;
      --text-muted: #b3a8c9;
      --border: #32254d;
      --danger: #ef4444;
      --success: #10b981;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
    /* Navigation */
    nav {
      display: flex; justify-content: space-between; align-items: center; padding: 18px 8%;
      background: rgba(14, 10, 23, 0.95); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.5rem; font-weight: 800; color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 10px;
    }
    .logo span { background: linear-gradient(135deg, var(--tertiary), var(--quaternary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-links a {
      color: var(--text-muted); text-decoration: none; margin-left: 22px; transition: color 0.3s; font-size: 0.95rem; font-weight: 600;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--quaternary); }
